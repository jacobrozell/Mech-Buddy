name: MechBuddy
attributes:
  ORGANIZATIONNAME: Jacob Rozell
options:
  minimumXcodeGenVersion: 2.44.0
  developmentLanguage: en
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7JT2JB89AV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  MechBuddy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Features
        excludes:
          - "**/README.md"
      - path: DesignSystem
        excludes:
          - "**/README.md"
      - path: Support
        excludes:
          - "**/README.md"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Content
        buildPhase: resources
        type: folder
    dependencies:
      - target: MechBuddyDomain
      - target: MechBuddyData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.mechbuddy
        PRODUCT_NAME: MechBuddy
        INFOPLIST_KEY_CFBundleDisplayName: Mech Buddy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" || true
          fi
        basedOnDependencyAnalysis: false

  MechBuddyDomain:
    type: framework
    platform: iOS
    sources:
      - path: Domain
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.mechbuddy.domain
        GENERATE_INFOPLIST_FILE: YES

  MechBuddyData:
    type: framework
    platform: iOS
    sources:
      - path: Data
        excludes:
          - "**/README.md"
      - path: Persistence
        excludes:
          - "**/README.md"
    dependencies:
      - target: MechBuddyDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.mechbuddy.data
        GENERATE_INFOPLIST_FILE: YES

  MechBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Resources/Content
        buildPhase: resources
        type: folder
    dependencies:
      - target: MechBuddyDomain
      - target: MechBuddyData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.mechbuddy.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MechBuddy:
    build:
      targets:
        MechBuddy: all
        MechBuddyTests: [test]
    test:
      targets:
        - MechBuddyTests
    run:
      config: Debug

  MechBuddyCI:
    build:
      targets:
        MechBuddy: all
        MechBuddyTests: [test]
    test:
      targets:
        - MechBuddyTests
      config: Debug
    run:
      config: Debug
